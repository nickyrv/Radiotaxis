<div class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-8">

    <div class="flex items-center justify-center mb-8">
      <div class="bg-blue-600 p-3 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 13l2-2m0 0l7-7 7 7m-16 0v6a2 2 0 002 2h3m10-8l2 2m0 0l-7 7-7-7m14 0v6a2 2 0 01-2 2h-3" />
        </svg>
      </div>
    </div>

    <h1 class="text-center text-gray-900 mb-2 text-lg font-semibold">Sistema de Gestión de Radiotaxis</h1>
    <p class="text-center text-gray-600 mb-8">Seleccione su rol para acceder</p>

    <div class="space-y-4 mb-8">
      
      <!-- ADMIN -->
      <button 
        (click)="selectRole('admin')"
        [ngClass]="selectedRole === 'admin' 
          ? 'border-blue-600 bg-blue-50' 
          : 'border-gray-200 hover:border-gray-300'"
        class="w-full p-4 rounded-lg border-2 transition-all"
      >
        <div class="flex items-center justify-between">
          <div class="text-left">
            <div class="text-gray-900 font-medium">Administrador</div>
            <div class="text-gray-600 text-sm">Gestión completa del sistema</div>
          </div>

          <!-- Radio -->
          <div 
            class="w-5 h-5 rounded-full border-2 flex items-center justify-center"
            [ngClass]="selectedRole === 'admin' ? 'border-blue-600 bg-blue-600' : 'border-gray-300'"
          >
            <div *ngIf="selectedRole === 'admin'" class="w-2 h-2 bg-white rounded-full"></div>
          </div>
        </div>
      </button>

      <!-- OWNER -->
      <button 
        (click)="selectRole('owner')"
        [ngClass]="selectedRole === 'owner' 
          ? 'border-blue-600 bg-blue-50' 
          : 'border-gray-200 hover:border-gray-300'"
        class="w-full p-4 rounded-lg border-2 transition-all"
      >
        <div class="flex items-center justify-between">
          <div class="text-left">
            <div class="text-gray-900 font-medium">Propietario</div>
            <div class="text-gray-600 text-sm">Consulta de rentabilidad</div>
          </div>

          <div 
            class="w-5 h-5 rounded-full border-2 flex items-center justify-center"
            [ngClass]="selectedRole === 'owner' ? 'border-blue-600 bg-blue-600' : 'border-gray-300'"
          >
            <div *ngIf="selectedRole === 'owner'" class="w-2 h-2 bg-white rounded-full"></div>
          </div>
        </div>
      </button>

      <!-- DRIVER -->
      <button 
        (click)="selectRole('driver')"
        [ngClass]="selectedRole === 'driver' 
          ? 'border-blue-600 bg-blue-50' 
          : 'border-gray-200 hover:border-gray-300'"
        class="w-full p-4 rounded-lg border-2 transition-all"
      >
        <div class="flex items-center justify-between">
          <div class="text-left">
            <div class="text-gray-900 font-medium">Conductor</div>
            <div class="text-gray-600 text-sm">Registro de entregas</div>
          </div>

          <div 
            class="w-5 h-5 rounded-full border-2 flex items-center justify-center"
            [ngClass]="selectedRole === 'driver' ? 'border-blue-600 bg-blue-600' : 'border-gray-300'"
          >
            <div *ngIf="selectedRole === 'driver'" class="w-2 h-2 bg-white rounded-full"></div>
          </div>
        </div>
      </button>

    </div>

    <button
      (click)="loginUser()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg transition-colors flex items-center justify-center gap-2"
    >
      <span>Ingresar al Sistema</span>
    </button>

  </div>
</div>
