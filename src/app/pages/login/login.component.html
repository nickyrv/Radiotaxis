<div class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center p-4">

  <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-8">

    <div class="flex items-center justify-center mb-8">
      <div class="bg-blue-600 p-3 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg"
          class="w-8 h-8 text-white"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 13l2-2m0 0l7-7 7 7m-16 0v6a2 2 0 002 2h3m10-8l2 2m0 0l-7 7-7-7m14 0v6a2 2 0 01-2 2h-3"
          />
        </svg>
      </div>
    </div>

    <h1 class="text-center text-gray-900 mb-2 text-lg font-semibold">
      Sistema de Gestión de Radiotaxis
    </h1>

    <p class="text-center text-gray-600 mb-8">
      Seleccione su rol para acceder
    </p>

    <div class="space-y-4 mb-8">

      <button
        type="button"
        (click)="selectRole('admin')"
        [disabled]="isBlocked"
        [ngClass]="selectedRole === 'admin'
          ? 'border-blue-600 bg-blue-50'
          : 'border-gray-200 hover:border-gray-300'"
        class="w-full p-4 rounded-lg border-2 transition-all"
      >
        <div class="flex items-center justify-between">
          <div class="text-left">
            <div class="text-gray-900 font-medium">Administrador</div>
            <div class="text-gray-600 text-sm">Gestión completa del sistema</div>
          </div>

          <div
            class="w-5 h-5 rounded-full border-2 flex items-center justify-center"
            [ngClass]="selectedRole === 'admin'
              ? 'border-blue-600 bg-blue-600'
              : 'border-gray-300'"
          >
            <div
              *ngIf="selectedRole === 'admin'"
              class="w-2 h-2 bg-white rounded-full"
            ></div>
          </div>
        </div>
      </button>

      <button
        type="button"
        (click)="selectRole('owner')"
        [disabled]="isBlocked"
        [ngClass]="selectedRole === 'owner'
          ? 'border-blue-600 bg-blue-50'
          : 'border-gray-200 hover:border-gray-300'"
        class="w-full p-4 rounded-lg border-2 transition-all"
      >
        <div class="flex items-center justify-between">
          <div class="text-left">
            <div class="text-gray-900 font-medium">Propietario</div>
            <div class="text-gray-600 text-sm">Consulta de rentabilidad</div>
          </div>

          <div
            class="w-5 h-5 rounded-full border-2 flex items-center justify-center"
            [ngClass]="selectedRole === 'owner'
              ? 'border-blue-600 bg-blue-600'
              : 'border-gray-300'"
          >
            <div
              *ngIf="selectedRole === 'owner'"
              class="w-2 h-2 bg-white rounded-full"
            ></div>
          </div>
        </div>
      </button>

      <button
        type="button"
        (click)="selectRole('driver')"
        [disabled]="isBlocked"
        [ngClass]="selectedRole === 'driver'
          ? 'border-blue-600 bg-blue-50'
          : 'border-gray-200 hover:border-gray-300'"
        class="w-full p-4 rounded-lg border-2 transition-all"
      >
        <div class="flex items-center justify-between">
          <div class="text-left">
            <div class="text-gray-900 font-medium">Conductor</div>
            <div class="text-gray-600 text-sm">Registro de entregas</div>
          </div>

          <div
            class="w-5 h-5 rounded-full border-2 flex items-center justify-center"
            [ngClass]="selectedRole === 'driver'
              ? 'border-blue-600 bg-blue-600'
              : 'border-gray-300'"
          >
            <div
              *ngIf="selectedRole === 'driver'"
              class="w-2 h-2 bg-white rounded-full"
            ></div>
          </div>
        </div>
      </button>

    </div>

    <div class="space-y-4 mb-6">

      <div>
        <label class="block text-gray-700 mb-2">Correo</label>
        <input
          type="email"
          [(ngModel)]="email"
          [disabled]="isBlocked"
          placeholder="admin&#64;radiotaxi.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
  <label class="block text-gray-700 mb-2">Contraseña</label>

  <div class="relative">
    <input
      [type]="showPassword ? 'text' : 'password'"
      [(ngModel)]="password"
      [disabled]="isBlocked"
      placeholder="******"
      class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <button
      type="button"
      (click)="showPassword = !showPassword"
      [disabled]="isBlocked"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
    >
      <span *ngIf="!showPassword">👁️</span>
      <span *ngIf="showPassword">🙈</span>
    </button>
  </div>
</div>

      <div class="text-right">
        <button
          type="button"
          (click)="openForgotPassword()"
          class="text-sm text-blue-600 hover:text-blue-700"
        >
          ¿Olvidaste tu contraseña?
        </button>
      </div>

    </div>

    <button
      type="button"
      (click)="loginUser()"
      [disabled]="isBlocked"
      [ngClass]="{
        'opacity-50 cursor-not-allowed': isBlocked
      }"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg transition-colors flex items-center justify-center gap-2"
    >
      <span>
        {{ isBlocked ? 'Acceso bloqueado' : 'Ingresar al Sistema' }}
      </span>
    </button>

    <button
      *ngIf="isBlocked"
      type="button"
      (click)="openForgotPassword(); $event.preventDefault(); $event.stopPropagation()"
      class="w-full mt-3 border border-blue-600 text-blue-600 hover:bg-blue-50 py-3 rounded-lg transition-colors"
    >
      Desbloquear acceso
    </button>

    <p class="text-center text-sm text-gray-500 mt-4">
      Demo:
      admin&#64;radiotaxi.com / 123456
    </p>

  </div>

  <!-- POPUP NOTIFICACIÓN -->

  <div
    *ngIf="showNotification"
    class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 z-50"
  >
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 animate-fade-in">

      <div class="flex justify-center mb-4">

        <div
          *ngIf="notificationType === 'error'"
          class="w-20 h-20 rounded-full bg-red-100 flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-10 h-10 text-red-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </div>

        <div
          *ngIf="notificationType === 'warning'"
          class="w-20 h-20 rounded-full bg-yellow-100 flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-10 h-10 text-yellow-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>

        <div
          *ngIf="notificationType === 'success'"
          class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-10 h-10 text-green-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>

      </div>

      <h2
        class="text-xl font-bold text-center mb-2"
        [ngClass]="{
          'text-red-600': notificationType === 'error',
          'text-yellow-600': notificationType === 'warning',
          'text-green-600': notificationType === 'success'
        }"
      >
        {{ notificationTitle }}
      </h2>

      <p class="text-gray-600 text-center mb-6">
        {{ notificationMessage }}
      </p>

      <button
        type="button"
        (click)="showNotification = false"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl transition-colors"
      >
        Entendido
      </button>

    </div>
  </div>

  <!-- POPUP RECUPERAR CONTRASEÑA -->

  <div
    *ngIf="showForgotPassword"
    class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 z-50"
  >
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6">

      <div class="flex justify-center mb-4">
        <div class="w-20 h-20 rounded-full bg-blue-100 flex items-center justify-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-10 h-10 text-blue-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-18 8h18a2 2 0 002-2V6a2 2 0 00-2-2H3a2 2 0 00-2 2v8a2 2 0 002 2z"
            />
          </svg>
        </div>
      </div>

      <h2 class="text-xl font-bold text-gray-900 text-center mb-2">
        Recuperar contraseña
      </h2>

      <p class="text-gray-600 text-center mb-6">
        Ingrese su correo registrado para recibir instrucciones de recuperación.
      </p>

      <input
        type="email"
        [(ngModel)]="recoveryEmail"
        placeholder="correo@radiotaxi.com"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <div class="flex gap-3">

        <button
          type="button"
          (click)="showForgotPassword = false"
          class="flex-1 px-4 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50"
        >
          Cancelar
        </button>

        <button
          type="button"
          (click)="sendRecoveryEmail()"
          class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
        >
          Enviar
        </button>

      </div>

    </div>
  </div>

</div>
