<div class="space-y-6">

  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">
        Gestión de Propietarios
      </h1>

      <p class="text-gray-600">
        Administración de propietarios
      </p>
    </div>

    <button
      (click)="showForm = true"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg"
    >
      Nuevo Propietario
    </button>
  </div>

  <!-- Buscador -->

  <div class="bg-white p-4 rounded-lg border">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Buscar propietario..."
      class="w-full border rounded-lg px-4 py-2"
    />
  </div>

  <!-- Cards -->

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <div
      *ngFor="let owner of filteredOwners"
      class="bg-white border rounded-lg p-6"
    >

      <h3 class="text-xl font-semibold text-gray-900">
        {{ owner.name }}
      </h3>

      <p class="text-gray-600 mt-2">
        {{ owner.email }}
      </p>

      <p class="text-gray-600">
        {{ owner.phone }}
      </p>

      <p class="text-gray-700 mt-3">
        Vehículos:
        {{ getVehiclesInfo(owner.vehicleIds) }}
      </p>

      <div class="flex gap-2 mt-4">

        <button
          (click)="handleEdit(owner)"
          class="flex-1 bg-yellow-500 text-white py-2 rounded-lg"
        >
          Editar
        </button>

        <button
          (click)="handleDelete(owner.id)"
          class="flex-1 bg-red-600 text-white py-2 rounded-lg"
        >
          Eliminar
        </button>

      </div>

    </div>

  </div>

</div>
<!-- FORM MODAL -->

<div
  *ngIf="showForm"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
>

  <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">

    <!-- Header -->

    <div class="p-6 border-b border-gray-200">

      <h2 class="text-gray-900 text-2xl font-bold">

        {{ editingOwner ? 'Editar Propietario' : 'Nuevo Propietario' }}

      </h2>

    </div>

    <!-- Form -->

    <div class="p-6 space-y-4">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Nombre -->

        <div>

          <label class="block text-gray-700 mb-2">
            Nombre Completo *
          </label>

          <input
            type="text"
            placeholder="Juan Propietario"
            [value]="editingOwner?.name || ''"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />

        </div>

        <!-- Teléfono -->

        <div>

          <label class="block text-gray-700 mb-2">
            Teléfono *
          </label>

          <input
            type="tel"
            placeholder="+591 77777777"
            [value]="editingOwner?.phone || ''"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />

        </div>

        <!-- Email -->

        <div class="md:col-span-2">

          <label class="block text-gray-700 mb-2">
            Email *
          </label>

          <input
            type="email"
            placeholder="correo@ejemplo.com"
            [value]="editingOwner?.email || ''"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />

        </div>

        <!-- Vehículos -->

        <div class="md:col-span-2">

          <label class="block text-gray-700 mb-2">
            Vehículos Asignados
          </label>

          <div class="space-y-2 max-h-40 overflow-y-auto border border-gray-300 rounded-lg p-3">

            <label
              *ngFor="let vehicle of mockVehicles"
              class="flex items-center gap-2 cursor-pointer"
            >

              <input
                type="checkbox"
                [checked]="editingOwner?.vehicleIds?.includes(vehicle.id)"
                class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
              />

              <span class="text-gray-700">

                {{ vehicle.plate }} -
                {{ vehicle.model }}
                ({{ vehicle.year }})

              </span>

            </label>

          </div>

        </div>

      </div>

    </div>

    <!-- Footer -->

    <div class="p-6 border-t border-gray-200 flex justify-end gap-3">

      <button
        (click)="showForm = false"
        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors"
      >
        Cancelar
      </button>

      <button
        (click)="showForm = false"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
      >
        Guardar
      </button>

    </div>

  </div>

</div>
