<div class="space-y-6">

  <!-- Header -->

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

    <div>

      <h1 class="text-2xl font-bold text-gray-900">
        Gestión de Relevos
      </h1>

      <p class="text-gray-600 mt-1">
        Administre los turnos de conductores
      </p>

    </div>

    <button
      (click)="showForm = true"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg"
    >
      Programar Relevo
    </button>

  </div>

  <!-- Timeline -->

  <div class="bg-white rounded-lg border border-gray-200 p-6">

    <h3 class="text-xl font-semibold text-gray-900 mb-6">
      Cronograma de Relevos
    </h3>

    <div class="space-y-4">

      <div
        *ngFor="let shift of shifts"
        class="relative pl-8 pb-8 border-l-2 border-gray-200"
      >

        <div
          class="absolute left-0 top-0 w-4 h-4 rounded-full -translate-x-[9px]"
          [ngClass]="{
            'bg-green-500': shift.status === 'active',
            'bg-blue-500': shift.status === 'scheduled',
            'bg-gray-400': shift.status === 'completed'
          }"
        ></div>

        <div class="bg-gray-50 rounded-lg p-4">

          <div class="flex justify-between items-center mb-3">

            <div class="flex gap-4">

              <span class="text-gray-900">
                {{ getVehiclePlate(shift.vehicleId) }}
              </span>

              <span class="text-gray-700">
                {{ getDriverName(shift.driverId) }}
              </span>

            </div>

            <span
              class="px-3 py-1 rounded-full text-sm"
              [ngClass]="getStatusColor(shift.status)"
            >
              {{ getStatusLabel(shift.status) }}
            </span>

          </div>

          <div class="flex gap-6 text-sm text-gray-600">

            <span>
              Inicio:
              {{ formatDateTime(shift.startTime) }}
            </span>

            <span>
              Fin:
              {{ formatDateTime(shift.endTime) }}
            </span>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
