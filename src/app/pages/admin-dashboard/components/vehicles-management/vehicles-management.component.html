<div class="space-y-6">

  <!-- HEADER -->

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

    <div>
      <h1 class="text-2xl font-bold text-gray-900">
        Gestión de Vehículos
      </h1>

      <p class="text-gray-600 mt-1">
        Administre la flota de vehículos
      </p>
    </div>

    <button
      (click)="openNewVehicleForm()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors"
    >
      Nuevo Vehículo
    </button>

  </div>

  <!-- SEARCH -->

  <div class="bg-white rounded-lg border border-gray-200 p-4">

    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Buscar por placa o modelo..."
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

  </div>

  <!-- TABLE -->

  <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">

    <div class="overflow-x-auto">

      <table class="w-full">

        <thead class="bg-gray-50 border-b border-gray-200">

          <tr>

            <th class="px-6 py-3 text-left">
              Placa
            </th>

            <th class="px-6 py-3 text-left">
              Modelo
            </th>

            <th class="px-6 py-3 text-left">
              Año
            </th>

            <th class="px-6 py-3 text-left">
              Propietario
            </th>

            <th class="px-6 py-3 text-left">
              Estado
            </th>

            <th class="px-6 py-3 text-left">
              Próximo Mant.
            </th>

            <th class="px-6 py-3 text-left">
              Acciones
            </th>

          </tr>

        </thead>

        <tbody class="divide-y divide-gray-200">

          <tr
            *ngFor="let vehicle of filteredVehicles"
            class="hover:bg-gray-50"
          >

            <td class="px-6 py-4">
              {{ vehicle.plate }}
            </td>

            <td class="px-6 py-4">
              {{ vehicle.model }}
            </td>

            <td class="px-6 py-4">
              {{ vehicle.year }}
            </td>

            <td class="px-6 py-4">
              {{ getOwnerName(vehicle.ownerId) }}
            </td>

            <td class="px-6 py-4">

              <span
                [class]="
                  'px-2 py-1 rounded-full text-sm ' +
                  getStatusColor(vehicle.status)
                "
              >
                {{ getStatusLabel(vehicle.status) }}
              </span>

            </td>

            <td class="px-6 py-4">
              {{ vehicle.nextMaintenance }}
            </td>

            <td class="px-6 py-4">

              <div class="flex gap-2">

                <button
                  (click)="handleEdit(vehicle)"
                  class="px-3 py-1 bg-blue-100 text-blue-700 rounded-lg"
                >
                  Editar
                </button>

                <button
                  (click)="handleDelete(vehicle.id)"
                  class="px-3 py-1 bg-red-100 text-red-700 rounded-lg"
                >
                  Eliminar
                </button>

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
