<div class="flex h-screen bg-gray-50">

  <!-- Sidebar -->
  <aside 
    class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200
    transform transition-transform duration-300 ease-in-out"
    [class.translate-x-0]="sidebarOpen"
    [class.-translate-x-full]="!sidebarOpen && true"
    [class.lg\:translate-x-0]="true"
  >
    <div class="flex flex-col h-full">

      <!-- Header -->
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h2 class="text-gray-900 text-lg font-semibold">Radiotaxis Admin</h2>

          <button 
            (click)="sidebarOpen = false" 
            class="lg:hidden text-gray-500 hover:text-gray-700"
          >
            <lucide-icon name="X" class="w-6 h-6"></lucide-icon>
          </button>
        </div>

        <p class="text-gray-600 text-sm mt-1">Administrador del Sistema</p>
      </div>

      <!-- Menu -->
      <nav class="flex-1 p-4 space-y-1">
        <button
          *ngFor="let item of menuItems"
          (click)="setView(item.id)"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors"
          [class.bg-blue-50]="currentView === item.id"
          [class.text-blue-600]="currentView === item.id"
          [class.text-gray-700]="currentView !== item.id"
          [class.hover\:bg-gray-50]="currentView !== item.id"
        >
          <lucide-icon [name]="item.icon" class="w-5 h-5"></lucide-icon>
          <span>{{ item.label }}</span>
        </button>
      </nav>

      <!-- Logout -->
      <div class="p-4 border-t border-gray-200">
        <button
          (click)="logout()"
          class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
        >
          <lucide-icon name="LogOut" class="w-5 h-5"></lucide-icon>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Overlay -->
  <div 
    *ngIf="sidebarOpen" 
    class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
    (click)="sidebarOpen = false"
  ></div>

  <!-- Main Content -->
  <main class="flex-1 overflow-auto">

    <!-- Mobile Header -->
    <div class="lg:hidden bg-white border-b border-gray-200 p-4">
      <button
        (click)="sidebarOpen = true"
        class="text-gray-700 hover:text-gray-900"
      >
        <lucide-icon name="Menu" class="w-6 h-6"></lucide-icon>
      </button>
    </div>

    <!-- Main Content -->
    <div class="p-6 lg:p-8" [ngSwitch]="currentView">

      <app-admin-overview *ngSwitchCase="'overview'"></app-admin-overview>

      <app-vehicles-management *ngSwitchCase="'vehicles'"></app-vehicles-management>

      <app-drivers-management *ngSwitchCase="'drivers'"></app-drivers-management>

      <app-owners-management *ngSwitchCase="'owners'"></app-owners-management>

      <app-shifts-management *ngSwitchCase="'shifts'"></app-shifts-management>

      <app-alerts-management *ngSwitchCase="'alerts'"></app-alerts-management>

    </div>
  </main>
</div>
