<div class="flex h-screen bg-gray-50">

  <!-- Sidebar -->
  <aside
    class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 transform transition-transform duration-300 ease-in-out"
    [ngClass]="{
      'translate-x-0': sidebarOpen,
      '-translate-x-full lg:translate-x-0': !sidebarOpen
    }"
  >

    <div class="flex flex-col h-full">

      <!-- Header -->
      <div class="p-6 border-b border-gray-200">

        <div class="flex items-center justify-between">

          <h2 class="text-gray-900 font-bold">
            Mi Portal
          </h2>

          <button
            (click)="sidebarOpen = false"
            class="lg:hidden text-gray-500 hover:text-gray-700"
          >
            ✕
          </button>

        </div>

        <p class="text-gray-600 text-sm mt-1">
          {{ currentOwner?.name || user?.name }}
        </p>

        <span class="inline-block mt-2 px-2 py-1 bg-purple-100 text-purple-700 text-sm rounded-full">
          Propietario
        </span>

      </div>

      <!-- Menu -->
      <nav class="flex-1 p-4 space-y-1">

        <button
          *ngFor="let item of menuItems"
          (click)="setView(item.id)"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors"
          [ngClass]="{
            'bg-purple-50 text-purple-700': currentView === item.id,
            'text-gray-700 hover:bg-gray-50': currentView !== item.id
          }"
        >

          <span>
            {{ item.icon }}
          </span>

          <span>
            {{ item.label }}
          </span>

        </button>

      </nav>

      <!-- Sidebar Stats -->
      <div class="p-4">

        <div class="p-4 bg-blue-50 rounded-lg">

          <div class="flex items-center gap-2 text-blue-600 mb-1">

            <span>
              🚕
            </span>

            <span>
              Mis Vehículos
            </span>

          </div>

          <div class="text-gray-900 text-xl font-bold">
            {{ ownerVehicles.length }}
          </div>

        </div>

      </div>

      <!-- Logout -->
      <div class="p-4 border-t border-gray-200">

        <button
          (click)="logout()"
          class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
        >

          <span>
            Cerrar Sesión
          </span>

        </button>

      </div>

    </div>

  </aside>

  <!-- Overlay -->
  <div
    *ngIf="sidebarOpen"
    class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
    (click)="sidebarOpen = false"
  ></div>

  <!-- Main -->
  <main class="flex-1 overflow-auto">

    <!-- Mobile Header -->
    <div class="lg:hidden bg-white border-b border-gray-200 p-4">

      <button
        (click)="sidebarOpen = true"
        class="text-gray-700 hover:text-gray-900"
      >
        ☰
      </button>

    </div>

    <div class="p-6 lg:p-8">

      <app-owner-overview
        *ngIf="currentView === 'overview'"
        [currentOwner]="currentOwner"
        [ownerVehicles]="ownerVehicles"
        [ownerPayments]="ownerPayments"
        [ownerMaintenances]="ownerMaintenances"
        [totalIncome]="totalIncome"
        [totalExpenses]="totalExpenses"
        [netProfit]="netProfit"
      ></app-owner-overview>

      <app-owner-profile
        *ngIf="currentView === 'profile'"
        [currentOwner]="currentOwner"
      ></app-owner-profile>

      <app-owner-vehicles
        *ngIf="currentView === 'vehicles'"
        [ownerVehicles]="ownerVehicles"
      ></app-owner-vehicles>

      <app-owner-requests
        *ngIf="currentView === 'requests'"
        [currentOwner]="currentOwner"
        [ownerVehicles]="ownerVehicles"
      ></app-owner-requests>

      <app-owner-reports
        *ngIf="currentView === 'reports'"
        [currentOwner]="currentOwner"
        [ownerVehicles]="ownerVehicles"
        [ownerPayments]="ownerPayments"
        [ownerMaintenances]="ownerMaintenances"
        [totalIncome]="totalIncome"
        [totalExpenses]="totalExpenses"
        [netProfit]="netProfit"
      ></app-owner-reports>

    </div>

  </main>

</div>
